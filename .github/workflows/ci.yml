name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest

    env:
      TURBO_TELEMETRY_DISABLED: 1
      # Prisma needs DATABASE_URL to generate client even in CI;
      # a dummy placeholder is enough — no real DB connection needed for build.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run check-types
