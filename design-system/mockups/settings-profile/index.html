<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup: Cài đặt thông tin cá nhân (Profile Settings)</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>
<div class="topbar">NEXUS<span class="note">Mockup đề xuất UI. Cài đặt thông tin cá nhân (Profile Settings).</span></div>
<div class="layout">
  <nav class="side" id="side" aria-label="Điều hướng cài đặt">
    <button class="ib side-x" id="side-x" aria-label="Đóng menu"><svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" class="ic" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></button>
    <a class="nav on" data-v="profile" id="n-profile"></a>
    <a class="nav" data-v="password" id="n-password"></a>
    <a class="nav" data-v="sessions" id="n-sessions"></a>
    <a class="nav" data-v="notifications" id="n-notifications"></a>
    <div class="sp"></div>
    <a class="nav" data-v="spec" id="n-spec"></a>
  </nav>
  <main class="main">
    <section class="view on col" id="v-profile"></section>
    <section class="view col" id="v-password"></section>
    <section class="view col" id="v-sessions"></section>
    <section class="view col" id="v-notifications"></section>
    <section class="view col" id="v-spec"></section>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<button class="burger" id="burger" aria-label="Mở menu" aria-expanded="false" aria-controls="side"><svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg></button>

<script src="js/icons.js"></script>
<script src="js/data/user.js"></script>
<script src="js/app.js"></script>
<script>
[["profile","user","Thông tin cơ bản"],["password","key","Đổi mật khẩu"],["sessions","laptop","Thiết bị &amp; Phiên"],["notifications","bell","Cài đặt thông báo"],["spec","type","Quy ước (tham khảo)"]]
  .forEach(([v,i,t])=>{document.getElementById("n-"+v).innerHTML=ic(i)+t});
</script>
<script src="js/views/delete-modal.js"></script>
<script src="js/views/profile.js"></script>
<script src="js/views/spec.js"></script>
<script>initRouter();</script>
</body>
</html>
