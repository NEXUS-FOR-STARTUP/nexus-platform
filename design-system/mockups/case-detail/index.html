<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup: Case detail redesign</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>
<div class="topbar">NEXUS<span class="note">Mockup đề xuất UI. Dữ liệu hồ sơ, lịch sử và tài liệu là mẫu bịa; câu hỏi và gợi ý lấy từ catalog CP1 và CP2 thật.</span></div>
<div class="layout">
  <nav class="side" id="side" aria-label="Điều hướng hồ sơ">
    <button class="ib side-x" id="side-x" aria-label="Đóng menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <a class="nav on" data-v="overview" id="n-overview"></a>
    <a class="nav" data-v="journey" id="n-journey"></a>
    <a class="nav" data-v="billing" id="n-billing"></a>
    <a class="nav" data-v="timeline" id="n-timeline"></a>
    <a class="nav" data-v="settings" id="n-settings"></a>
    <div class="sp"></div>
    <a class="nav" data-v="spec" id="n-spec"></a>
  </nav>
  <main class="main">
    <section class="view on col" id="v-overview"></section>
    <section class="view col" id="v-journey"></section>
    <section class="view col" id="v-billing"></section>
    <section class="view col narrow" id="v-timeline"></section>
    <section class="view col narrow" id="v-settings"></section>
    <section class="view col" id="v-spec"></section>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<button class="burger" id="burger" aria-label="Mở menu" aria-expanded="false" aria-controls="side"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/data/history.js"></script>
<script src="js/data/stage.js"></script>
<script src="js/data/questions-cp1.js"></script>
<script src="js/data/questions-cp2.js"></script>
<script src="js/data/unlocks.js"></script>
<script src="js/data/states.js"></script>
<script src="js/data/stages.js"></script>
<script>
[["overview","dash","Tổng quan dự án"],["journey","compass","Hành trình"],["billing","card","Lượt chấm &amp; thanh toán"],["timeline","hist","Lịch sử hoạt động"],["settings","gear","Cài đặt"],["spec","type","Quy ước (tham khảo)"]]
  .forEach(([v,i,t])=>{document.getElementById("n-"+v).innerHTML=ic(i)+t});
</script>
<script src="js/views/overview.js"></script>
<script src="js/views/journey.js"></script>
<script src="js/views/stage-draft.js"></script>
<script src="js/views/stage-files.js"></script>
<script src="js/views/stage-results.js"></script>
<script src="js/views/grading.js"></script>
<script src="js/views/audit.js"></script>
<script src="js/views/upload.js"></script>
<script src="js/views/billing.js"></script>
<script src="js/views/timeline.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/spec.js"></script>
<script>initRouter();</script>
</body>
</html>
