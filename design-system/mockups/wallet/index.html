<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup: Ví &amp; Lịch sử giao dịch (Nexus Wallet)</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>
<div class="topbar">NEXUS<span class="note">Mockup đề xuất UI. Ví Nexus &amp; Quản lý giao dịch (Wallet &amp; Topup).</span></div>
<div class="layout">
  <nav class="side" id="side" aria-label="Điều hướng ví">
    <button class="ib side-x" id="side-x" aria-label="Đóng menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <a class="nav on" data-v="wallet" id="n-wallet"></a>
    <div class="sp"></div>
    <a class="nav" data-v="spec" id="n-spec"></a>
  </nav>
  <main class="main">
    <section class="view on col" id="v-wallet"></section>
    <section class="view col" id="v-spec"></section>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<button class="burger" id="burger" aria-label="Mở menu" aria-expanded="false" aria-controls="side"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button>

<script src="js/icons.js"></script>
<script src="js/data/wallet.js"></script>
<script src="js/data/transactions.js"></script>
<script src="js/data/deposits.js"></script>
<script src="js/app.js"></script>
<script>
[["wallet","wallet","Ví của tôi"],["spec","type","Quy ước (tham khảo)"]]
  .forEach(([v,i,t])=>{document.getElementById("n-"+v).innerHTML=ic(i)+t});
</script>
<script src="js/views/balance.js"></script>
<script src="js/views/history.js"></script>
<script src="js/views/proofs.js"></script>
<script src="js/views/topup-modal.js"></script>
<script src="js/views/spec.js"></script>
<script>initRouter();</script>
</body>
</html>
