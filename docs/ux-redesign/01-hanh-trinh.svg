<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif">
  <rect width="1280" height="860" fill="#F8FAFC"/>
  <!-- top bar -->
  <rect width="1280" height="56" fill="#fff" stroke="#E2E8F0"/>
  <text x="24" y="36" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="2">NEXUS</text>
  <text x="140" y="34" font-size="14" fill="#334155">Bài viết</text>
  <text x="1080" y="34" font-size="13" fill="#64748B">Ví: 50,000 VND</text>
  <circle cx="1232" cy="28" r="16" fill="#E2E8F0"/><text x="1232" y="33" font-size="12" text-anchor="middle" fill="#0F172A">PH</text>

  <!-- sidebar -->
  <rect x="0" y="56" width="232" height="804" fill="#fff" stroke="#E2E8F0"/>
  <text x="20" y="90" font-size="12" fill="#64748B">DỰ ÁN</text>
  <text x="20" y="112" font-size="15" font-weight="700" fill="#0F172A">EcoCup Campus</text>
  <g font-size="14" fill="#334155">
    <text x="44" y="160">Tổng quan dự án</text>
    <rect x="12" y="176" width="208" height="38" rx="8" fill="#EFF6FF"/>
    <text x="44" y="200" fill="#2563EB" font-weight="700">Hành trình</text>
    <text x="44" y="242">Lượt chấm &amp; thanh toán</text>
    <text x="44" y="282">Thảo luận</text>
    <text x="44" y="322">Lịch sử hoạt động</text>
    <text x="44" y="362">Cài đặt</text>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="1.5">
    <circle cx="26" cy="155" r="7"/><rect x="19" y="188" width="14" height="14" rx="2" stroke="#2563EB"/><rect x="19" y="231" width="14" height="10" rx="2"/>
    <path d="M19,272 h14 v9 h-9 l-5,4 z"/><circle cx="26" cy="317" r="7"/><circle cx="26" cy="357" r="6"/>
  </g>
  <rect x="12" y="740" width="208" height="96" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-dasharray="4 3"/>
  <text x="24" y="764" font-size="12" font-weight="700" fill="#0F172A">Sidebar cố định 6 mục</text>
  <text x="24" y="784" font-size="12" fill="#64748B">Thêm 20 dịch vụ: sidebar</text>
  <text x="24" y="802" font-size="12" fill="#64748B">không dài ra. Dịch vụ mới</text>
  <text x="24" y="820" font-size="12" fill="#64748B">chỉ thêm 1 thẻ ở bên phải.</text>

  <!-- main -->
  <text x="260" y="100" font-size="24" font-weight="700" fill="#0F172A">Hành trình khởi nghiệp</text>
  <text x="260" y="126" font-size="14" fill="#64748B">Soạn tài liệu miễn phí ở mọi giai đoạn. Chấm bằng AI khi bạn thấy sẵn sàng.</text>
  <g font-size="13">
    <rect x="260" y="146" width="70" height="30" rx="15" fill="#0F172A"/><text x="295" y="166" text-anchor="middle" fill="#fff">Tất cả</text>
    <rect x="338" y="146" width="104" height="30" rx="15" fill="#fff" stroke="#E2E8F0"/><text x="390" y="166" text-anchor="middle" fill="#334155">Đang làm (1)</text>
    <rect x="450" y="146" width="96" height="30" rx="15" fill="#fff" stroke="#E2E8F0"/><text x="498" y="166" text-anchor="middle" fill="#334155">Đã xong (1)</text>
    <rect x="554" y="146" width="116" height="30" rx="15" fill="#fff" stroke="#E2E8F0"/><text x="612" y="166" text-anchor="middle" fill="#334155">Sắp ra mắt (2)</text>
  </g>

  <text x="260" y="218" font-size="13" font-weight="700" fill="#64748B">CÁC GIAI ĐOẠN CHÍNH · theo thứ tự đề xuất, không khóa</text>

  <!-- card 1 -->
  <rect x="260" y="232" width="232" height="214" rx="12" fill="#fff" stroke="#E2E8F0"/>
  <text x="280" y="260" font-size="12" fill="#64748B">Bước 1</text>
  <rect x="384" y="246" width="92" height="22" rx="11" fill="#F0FDF4"/><text x="430" y="261" font-size="12" text-anchor="middle" fill="#16A34A">Có kết quả</text>
  <text x="280" y="290" font-size="17" font-weight="700" fill="#0F172A">Ý tưởng</text>
  <text x="280" y="312" font-size="12" fill="#64748B">Vấn đề, giải pháp, khách hàng</text>
  <text x="280" y="328" font-size="12" fill="#64748B">mục tiêu, đội ngũ</text>
  <rect x="280" y="348" width="192" height="6" rx="3" fill="#E2E8F0"/><rect x="280" y="348" width="192" height="6" rx="3" fill="#16A34A"/>
  <text x="280" y="374" font-size="12" fill="#334155">18/18 câu · lần chấm gần nhất 7.5/10</text>
  <rect x="280" y="396" width="192" height="34" rx="8" fill="#fff" stroke="#E2E8F0"/><text x="376" y="418" font-size="13" text-anchor="middle" fill="#0F172A">Xem kết quả</text>

  <!-- card 2 active -->
  <rect x="508" y="232" width="232" height="214" rx="12" fill="#fff" stroke="#2563EB" stroke-width="2"/>
  <text x="528" y="260" font-size="12" fill="#64748B">Bước 2</text>
  <rect x="640" y="246" width="84" height="22" rx="11" fill="#FFF7ED"/><text x="682" y="261" font-size="12" text-anchor="middle" fill="#EA580C">Đang soạn</text>
  <text x="528" y="290" font-size="17" font-weight="700" fill="#0F172A">Thị trường</text>
  <text x="528" y="312" font-size="12" fill="#64748B">Khảo sát, phỏng vấn, đối thủ,</text>
  <text x="528" y="328" font-size="12" fill="#64748B">chuẩn bị debate</text>
  <rect x="528" y="348" width="192" height="6" rx="3" fill="#E2E8F0"/><rect x="528" y="348" width="46" height="6" rx="3" fill="#2563EB"/>
  <text x="528" y="374" font-size="12" fill="#334155">6/27 câu · còn 3 lượt chấm</text>
  <rect x="528" y="396" width="192" height="34" rx="8" fill="#2563EB"/><text x="624" y="418" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">Tiếp tục</text>

  <!-- card 3 -->
  <rect x="756" y="232" width="232" height="214" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="776" y="260" font-size="12" fill="#94A3B8">Bước 3</text>
  <rect x="876" y="246" width="96" height="22" rx="11" fill="#F1F5F9"/><text x="924" y="261" font-size="12" text-anchor="middle" fill="#64748B">Sắp ra mắt</text>
  <text x="776" y="290" font-size="17" font-weight="700" fill="#64748B">Sản phẩm &amp; mô hình</text>
  <text x="776" y="312" font-size="12" fill="#94A3B8">MVP, Business Model Canvas,</text>
  <text x="776" y="328" font-size="12" fill="#94A3B8">SWOT</text>
  <rect x="776" y="396" width="192" height="34" rx="8" fill="#fff" stroke="#E2E8F0"/><text x="872" y="418" font-size="13" text-anchor="middle" fill="#64748B">Báo tôi khi mở</text>

  <!-- card 4 -->
  <rect x="1004" y="232" width="232" height="214" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="1024" y="260" font-size="12" fill="#94A3B8">Bước 4</text>
  <rect x="1124" y="246" width="96" height="22" rx="11" fill="#F1F5F9"/><text x="1172" y="261" font-size="12" text-anchor="middle" fill="#64748B">Sắp ra mắt</text>
  <text x="1024" y="290" font-size="17" font-weight="700" fill="#64748B">Gọi vốn &amp; tài chính</text>
  <text x="1024" y="312" font-size="12" fill="#94A3B8">Pitch deck, bảng P&amp;L,</text>
  <text x="1024" y="328" font-size="12" fill="#94A3B8">dự phóng dòng tiền</text>
  <rect x="1024" y="396" width="192" height="34" rx="8" fill="#fff" stroke="#E2E8F0"/><text x="1120" y="418" font-size="13" text-anchor="middle" fill="#64748B">Báo tôi khi mở</text>

  <!-- dịch vụ thêm: dạng danh sách để chịu được nhiều mục -->
  <text x="260" y="490" font-size="13" font-weight="700" fill="#64748B">DỊCH VỤ THÊM · dạng danh sách, chịu được 20+ mục</text>
  <rect x="260" y="504" width="976" height="208" rx="12" fill="#fff" stroke="#E2E8F0"/>
  <g font-size="14">
    <circle cx="292" cy="536" r="14" fill="#EFF6FF"/>
    <text x="320" y="532" fill="#0F172A" font-weight="600">Đánh giá đội ngũ</text><text x="320" y="550" font-size="12" fill="#64748B">Đo độ khớp vai trò và kỹ năng của nhóm</text>
    <rect x="980" y="524" width="80" height="24" rx="12" fill="#F0FDF4"/><text x="1020" y="540" font-size="12" text-anchor="middle" fill="#16A34A">Miễn phí</text>
    <text x="1200" y="541" fill="#94A3B8">›</text>
    <line x1="276" y1="572" x2="1220" y2="572" stroke="#F1F5F9"/>
    <circle cx="292" cy="604" r="14" fill="#F1F5F9"/>
    <text x="320" y="600" fill="#0F172A" font-weight="600">Mentor 1-1 với chuyên gia</text><text x="320" y="618" font-size="12" fill="#64748B">Đặt lịch góp ý trực tiếp cho một giai đoạn</text>
    <rect x="980" y="592" width="96" height="24" rx="12" fill="#F1F5F9"/><text x="1028" y="608" font-size="12" text-anchor="middle" fill="#64748B">Sắp ra mắt</text>
    <text x="1200" y="609" fill="#94A3B8">›</text>
    <line x1="276" y1="640" x2="1220" y2="640" stroke="#F1F5F9"/>
    <text x="276" y="680" font-size="13" fill="#94A3B8">+ Mỗi dịch vụ mới = 1 dòng ở đây, đọc từ danh mục dịch vụ của server.</text>
  </g>

  <!-- chú thích -->
  <g font-size="12" fill="#334155">
    <text x="260" y="752" font-weight="700" fill="#0F172A">Ghi chú</text>
    <text x="260" y="774">1. Sidebar chỉ có "Hành trình". Các giai đoạn và dịch vụ hiển thị ở vùng chính, không xổ con trong sidebar.</text>
    <text x="260" y="794">2. UI dùng tên đời thường (Ý tưởng, Thị trường…). CP1/CP2 chỉ là mã nội bộ.</text>
    <text x="260" y="814">3. Mỗi thẻ có đúng 3 thứ: trạng thái, tiến độ + số lượt, 1 nút hành động. Bấm thẻ → trang chi tiết giai đoạn.</text>
    <text x="260" y="834">4. Giá không hiện ở đây. Giá chỉ xuất hiện trong hộp mua lượt.</text>
  </g>
</svg>
