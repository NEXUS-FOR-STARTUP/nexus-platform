  <text x="606" y="430" font-size="13" fill="#94A3B8">Nhập câu trả lời…</text>
  <rect x="590" y="630" width="622" height="78" rx="8" fill="#FFF7ED" stroke="#FED7AA"/>
  <rect x="606" y="648" width="16" height="16" rx="3" fill="#fff" stroke="#EA580C"/>
  <text x="632" y="661" font-size="14" fill="#0F172A" font-weight="600">Nhóm đã phỏng vấn ít nhất 2 chuyên gia có từ 6 tháng kinh nghiệm</text>
