  <text x="606" y="358" font-size="13" fill="#334155">hơn khảo sát Google Form, hãy ưu tiên nói chuyện trực tiếp.</text>
  <text x="606" y="378" font-size="12" fill="#2563EB">Đọc thêm: Cách phỏng vấn chuyên gia ›</text>
