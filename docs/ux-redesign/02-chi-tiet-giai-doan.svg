  <text x="792" y="982" font-size="13" fill="#2563EB">Xem chi tiết ›</text><text x="1200" y="982" font-size="13" text-anchor="end" fill="#2563EB">Tải PDF</text>
  <rect x="776" y="1016" width="210" height="36" rx="8" fill="#fff" stroke="#2563EB"/><text x="881" y="1039" font-size="13" text-anchor="middle" fill="#2563EB">Chấm lại bản đã sửa</text>
  <text x="776" y="1080" font-size="12" fill="#94A3B8">Chưa có kết quả → "Chưa chấm lần nào. Chấm bài" (empty state có hành động)</text>
