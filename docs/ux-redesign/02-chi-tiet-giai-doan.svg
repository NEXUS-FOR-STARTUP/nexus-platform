  <text x="632" y="700" font-size="12" fill="#9A3412">Không tick: tiêu chí này bị tính chưa đạt.</text>
  <rect x="590" y="732" width="110" height="38" rx="8" fill="#fff" stroke="#E2E8F0"/><text x="645" y="756" font-size="14" text-anchor="middle" fill="#334155">‹ Câu trước</text>
  <rect x="1072" y="732" width="140" height="38" rx="8" fill="#2563EB"/><text x="1142" y="756" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">Lưu &amp; câu tiếp</text>

  <!-- previews: 2 tab con còn lại -->
