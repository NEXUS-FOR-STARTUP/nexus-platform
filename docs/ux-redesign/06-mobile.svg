    <g stroke="#0F172A" stroke-width="2"><line x1="18" y1="34" x2="34" y2="34"/><line x1="18" y1="42" x2="34" y2="42"/><line x1="18" y1="50" x2="34" y2="50"/></g>
    <text x="46" y="47" font-size="13" font-weight="700" fill="#0F172A">EcoCup · Hành trình</text>
