    <rect x="16" y="620" width="248" height="40" rx="8" fill="#2563EB"/><text x="140" y="645" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">Chấm ngay</text>
    <text x="140" y="712" font-size="11" text-anchor="middle" fill="#64748B">2 trạng thái riêng: notification HOẶC sheet</text>
