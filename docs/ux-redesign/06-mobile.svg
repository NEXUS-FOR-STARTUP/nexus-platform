    <text x="28" y="80" font-size="11" fill="#334155">Mỗi dự án chấm một giai đoạn</text><text x="28" y="96" font-size="11" fill="#334155">một lúc. Khi xong bạn chấm tiếp được.</text>
    <rect x="0" y="300" width="280" height="400" rx="20" fill="#fff"/>
