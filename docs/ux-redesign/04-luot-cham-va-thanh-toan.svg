<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif">
  <rect width="1280" height="900" fill="#F8FAFC"/>
  <rect width="1280" height="56" fill="#fff" stroke="#E2E8F0"/>
  <text x="24" y="36" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="2">NEXUS</text>
  <circle cx="1232" cy="28" r="16" fill="#E2E8F0"/><text x="1232" y="33" font-size="12" text-anchor="middle">PH</text>

  <rect x="0" y="56" width="232" height="844" fill="#fff" stroke="#E2E8F0"/>
  <text x="20" y="90" font-size="12" fill="#64748B">DỰ ÁN</text>
  <text x="20" y="112" font-size="15" font-weight="700" fill="#0F172A">EcoCup Campus</text>
  <g font-size="14" fill="#334155">
    <text x="44" y="160">Tổng quan dự án</text>
    <text x="44" y="200">Hành trình</text>
    <rect x="12" y="218" width="208" height="38" rx="8" fill="#EFF6FF"/><text x="44" y="242" fill="#2563EB" font-weight="700">Lượt chấm &amp; thanh toán</text>
    <text x="44" y="282">Thảo luận</text>
    <text x="44" y="322">Lịch sử hoạt động</text>
    <text x="44" y="362">Cài đặt</text>
  </g>

  <text x="260" y="100" font-size="24" font-weight="700" fill="#0F172A">Lượt chấm &amp; thanh toán</text>
  <text x="260" y="126" font-size="14" fill="#64748B">Nơi duy nhất để xem số dư, mua thêm lượt và xem lịch sử giao dịch của dự án.</text>

  <!-- wallet -->
  <rect x="260" y="148" width="976" height="96" rx="12" fill="#fff" stroke="#E2E8F0"/>
  <text x="284" y="180" font-size="13" fill="#64748B">Số dư ví Nexus (dùng chung mọi dự án)</text>
  <text x="284" y="218" font-size="26" font-weight="700" fill="#0F172A">50,000 VND</text>
  <rect x="1000" y="176" width="100" height="40" rx="8" fill="#2563EB"/><text x="1050" y="201" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">Nạp tiền</text>
  <text x="1212" y="201" font-size="13" text-anchor="end" fill="#2563EB">Lịch sử ví ›</text>

  <!-- per service -->
  <text x="260" y="284" font-size="15" font-weight="700" fill="#0F172A">Lượt chấm theo giai đoạn</text>
  <rect x="260" y="298" width="976" height="250" rx="12" fill="#fff" stroke="#E2E8F0"/>
  <g font-size="13" fill="#64748B">
    <text x="284" y="328">Giai đoạn / dịch vụ</text><text x="620" y="328">Còn lại</text><text x="780" y="328">Gói</text>
  </g>
  <line x1="260" y1="342" x2="1236" y2="342" stroke="#E2E8F0"/>
  <g font-size="14">
    <text x="284" y="378" fill="#0F172A" font-weight="600">Ý tưởng</text>
    <text x="620" y="378" fill="#0F172A">1 lượt</text><text x="780" y="378" fill="#334155">2 lượt · 79,000 VND</text>
    <rect x="1096" y="358" width="116" height="32" rx="8" fill="#fff" stroke="#2563EB"/><text x="1154" y="379" text-anchor="middle" fill="#2563EB">Mua thêm</text>
    <line x1="284" y1="402" x2="1212" y2="402" stroke="#F1F5F9"/>
    <text x="284" y="434" fill="#0F172A" font-weight="600">Thị trường</text>
    <text x="620" y="434" fill="#0F172A">3 lượt</text><text x="780" y="434" fill="#334155">4 lượt · 79,000 VND</text>
    <rect x="1096" y="414" width="116" height="32" rx="8" fill="#fff" stroke="#2563EB"/><text x="1154" y="435" text-anchor="middle" fill="#2563EB">Mua thêm</text>
    <line x1="284" y1="458" x2="1212" y2="458" stroke="#F1F5F9"/>
    <text x="284" y="490" fill="#94A3B8">Sản phẩm &amp; mô hình</text>
    <text x="620" y="490" fill="#94A3B8">—</text><text x="780" y="490" fill="#94A3B8">Sắp ra mắt</text>
    <text x="284" y="530" fill="#94A3B8">Gọi vốn &amp; tài chính</text>
    <text x="620" y="530" fill="#94A3B8">—</text><text x="780" y="530" fill="#94A3B8">Sắp ra mắt</text>
  </g>
  <text x="260" y="572" font-size="12" fill="#94A3B8">Mỗi dòng đọc từ danh mục dịch vụ. "Mua thêm" mở đúng hộp mua của dòng đó (xem 03).</text>

  <!-- history -->
  <text x="260" y="618" font-size="15" font-weight="700" fill="#0F172A">Lịch sử giao dịch</text>
  <g font-size="13">
    <rect x="260" y="632" width="70" height="30" rx="15" fill="#0F172A"/><text x="295" y="652" text-anchor="middle" fill="#fff">Tất cả</text>
    <rect x="338" y="632" width="76" height="30" rx="15" fill="#fff" stroke="#E2E8F0"/><text x="376" y="652" text-anchor="middle" fill="#334155">Ý tưởng</text>
    <rect x="422" y="632" width="94" height="30" rx="15" fill="#fff" stroke="#E2E8F0"/><text x="469" y="652" text-anchor="middle" fill="#334155">Thị trường</text>
    <rect x="1076" y="632" width="160" height="30" rx="8" fill="#fff" stroke="#E2E8F0"/><text x="1092" y="652" fill="#334155">Mọi loại giao dịch ▾</text>
  </g>
  <rect x="260" y="676" width="976" height="200" rx="12" fill="#fff" stroke="#E2E8F0"/>
  <g font-size="13" fill="#64748B">
    <text x="284" y="704">Thời gian</text><text x="440" y="704">Nội dung</text><text x="780" y="704">Giai đoạn</text><text x="960" y="704">Biến động</text><text x="1212" y="704" text-anchor="end">Còn lại</text>
  </g>
  <line x1="260" y1="716" x2="1236" y2="716" stroke="#E2E8F0"/>
  <g font-size="13" fill="#0F172A">
    <text x="284" y="746">12/10 14:02</text><text x="440" y="746">Chấm toàn bộ bài</text><text x="780" y="746">Thị trường</text><text x="960" y="746" fill="#DC2626">−1 lượt</text><text x="1212" y="746" text-anchor="end">3 lượt</text>
    <text x="284" y="784">11/10 09:15</text><text x="440" y="784">Mua gói 4 lượt · 79,000 VND</text><text x="780" y="784">Thị trường</text><text x="960" y="784" fill="#16A34A">+4 lượt</text><text x="1212" y="784" text-anchor="end">4 lượt</text>
    <text x="284" y="822">02/10 20:40</text><text x="440" y="822">Chấm lần đầu</text><text x="780" y="822">Ý tưởng</text><text x="960" y="822" fill="#DC2626">−1 lượt</text><text x="1212" y="822" text-anchor="end">1 lượt</text>
    <text x="284" y="860" fill="#64748B">Cần API trả kèm giai đoạn cho mỗi dòng ledger (hiện bị bỏ ở biên API)</text>
  </g>
</svg>
